<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عالم توتا المخبأ 🐾✨</title>
    
    <!-- خطوط جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- مكتبات (أيقونات، نوافذ منبثقة، ألعاب نارية) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- ملف التصميم الخاص بصفحة القفل فقط -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <section id="lock-screen" class="lock-screen">
        <div class="lock-content">
            <h1 class="title-lock">عالم توتا المخبأ 🐾✨</h1>
            <p class="desc-lock">هنا تنطبخ مفاجأة خاصة جداً لألطف وأحن أخت وصديقة في الدنيا! هذا المكان يحسب الثواني للحظة الموعودة..</p>
            
            <!-- شريط طاقة الانتظار -->
            <div class="battery-section">
                <p class="battery-title">طاقة اكتمال المفاجأة 🔋</p>
                <div class="battery-bar">
                    <div class="battery-fill" id="battery-fill"></div>
                    <span class="battery-text" id="battery-text">0%</span>
                </div>
            </div>

            <!-- العداد التنازلي -->
            <div class="countdown-grid">
                <div class="cd-box"><span id="cd-days">00</span><small>يوم</small></div>
                <div class="cd-box"><span id="cd-hours">00</span><small>ساعة</small></div>
                <div class="cd-box"><span id="cd-mins">00</span><small>دقيقة</small></div>
                <div class="cd-box"><span id="cd-secs">00</span><small>ثانية</small></div>
            </div>

            <!-- البصمة التفاعلية -->
            <div class="fingerprint-wrapper" id="fp-wrapper">
                <div class="fp-icon"><i class="fas fa-paw"></i></div>
                <div class="laser-scanner"></div>
            </div>
            <p class="fp-hint" id="fp-status">اضغطي مطولاً للبصمة 👆</p>
        </div>
    </section>

    <!-- ملف الجافاسكربت الخاص بصفحة القفل فقط -->
    <script src="index.js"></script>
</body>
</html>
